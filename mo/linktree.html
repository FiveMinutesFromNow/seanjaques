<style>
  :root {
    --paper: #F5E7E2;      /* powder rose */
    --ink: #3B2130;        /* deep plum */
    --berry: #A84155;      /* raspberry accent */
    --milk: #FBF4F1;       /* raised surface */
    --ink-soft: rgba(59, 33, 48, 0.62);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Fraunces", Georgia, serif;
    font-optical-sizing: auto;
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }

  .page {
    width: 100%;
    max-width: 430px;
    padding: 56px 28px 48px;
  }

  /* ---------- Masthead ---------- */

  .portrait {
    width: 108px;
    height: 108px;
    border-radius: 50%;
    background: var(--milk);
    border: 1px solid rgba(59, 33, 48, 0.18);
    margin: 0 auto 26px;
    overflow: hidden;
  }
  .portrait img { width: 100%; height: 100%; object-fit: cover; display: block; }

  h1 {
    font-size: 46px;
    font-weight: 560;
    line-height: 0.98;
    letter-spacing: -0.01em;
    text-align: center;
  }
  h1 .surname {
    display: block;
    font-style: italic;
    font-weight: 420;
  }
  h1 .apostrophe { color: var(--berry); font-style: italic; }

  .tagline {
    text-align: center;
    font-size: 16px;
    font-weight: 340;
    line-height: 1.5;
    margin-top: 16px;
    color: var(--ink-soft);
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
  }
  .tagline em { font-style: italic; color: var(--ink); }

  /* ---------- Link index ---------- */

  .index { margin-top: 40px; }

  .index a {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    text-decoration: none;
    color: var(--ink);
    padding: 15px 4px;
    border-bottom: 1px solid rgba(59, 33, 48, 0.16);
    transition: color 140ms ease;
  }
  .index a:first-child { border-top: 1px solid rgba(59, 33, 48, 0.16); }
  .index a:hover .index-name,
  .index a:focus-visible .index-name { color: var(--berry); }
  .index a:focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; }

  .index-name { font-size: 19px; font-weight: 420; }

  /* ---------- Social logos ---------- */

  .social {
    margin-top: 42px;
    display: flex;
    justify-content: center;
    gap: 30px;
  }
  .social a {
    color: var(--ink);
    display: inline-flex;
    padding: 6px;
    transition: color 140ms ease;
  }
  .social a:hover, .social a:focus-visible { color: var(--berry); }
  .social a:focus-visible { outline: 2px solid var(--berry); outline-offset: 2px; }
  .social svg { width: 24px; height: 24px; display: block; }

  .site {
    margin-top: 26px;
    text-align: center;
  }
  .site a {
    color: var(--ink-soft);
    text-decoration: none;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .site a:hover, .site a:focus-visible { color: var(--ink); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
